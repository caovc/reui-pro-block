name: Diagnose native Flow toast interactions on Linux
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:tooling
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: List exactly the four affected native cases
        run: |
          mkdir -p /tmp/bricklane-flow-toast-linux
          npx playwright test tests/flow-agent-native-select.spec.ts tests/flow-inspector-fields.spec.ts --grep 'agent App selection preserves native interaction|workflow select typeahead, Escape, save and draft cancellation' --list > /tmp/bricklane-flow-toast-linux/discovery.log
      - name: Run the affected cases under the original CI configuration
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/bricklane-flow-toast-linux/report.json
        run: >-
          npx playwright test
          tests/flow-agent-native-select.spec.ts
          tests/flow-inspector-fields.spec.ts
          --grep 'agent App selection preserves native interaction|workflow select typeahead, Escape, save and draft cancellation'
          --retries=0 --reporter=list,json
          --output=/tmp/bricklane-flow-toast-linux/artifacts
      - name: Upload original native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-toast-linux-evidence-${{ github.run_id }}
          path: /tmp/bricklane-flow-toast-linux/
          if-no-files-found: ignore
          retention-days: 7
