name: Deploy component previews
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
      pages_tar_sha256: ${{ steps.pages_digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:tooling
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Record exact Pages payload
        id: pages_digest
        shell: bash
        run: |
          pages_tar_digest=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          echo "sha256=${pages_tar_digest%% *}" >> "$GITHUB_OUTPUT"

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use Ubuntu HTTPS package mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\tpriority:%s\n' \
              'https://archive.ubuntu.com/ubuntu/' 1 \
              'https://security.ubuntu.com/ubuntu/' 2 | \
              sudo tee /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium
      - name: Require the exact Pages artifact
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: test -n "$PAGES_ARTIFACT_ID"
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.pages_artifact_id }}
          merge-multiple: true
          path: .pages-artifact
      - name: Restore the exact Pages dist
        env:
          EXPECTED_PAGES_TAR_SHA256: ${{ needs.build.outputs.pages_tar_sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_PAGES_TAR_SHA256" '.pages-artifact/artifact.tar' | sha256sum --check -
          mkdir -p dist
          tar -xf .pages-artifact/artifact.tar -C dist
      - name: Run the complete suite shard
        run: npm test -- --shard=${{ matrix.shard }}/4 --reporter=list,blob,github --workers=1
      - name: Upload failed browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: /tmp/reui-pro-block-playwright/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload native blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [build, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
