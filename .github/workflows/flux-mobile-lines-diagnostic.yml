name: Diagnose Flux mobile native lines
on:
  push:
    branches: [codex/flux-mobile-lines-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use Ubuntu HTTPS package mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\tpriority:%s\n' \
              'https://archive.ubuntu.com/ubuntu/' 1 \
              'https://security.ubuntu.com/ubuntu/' 2 | \
              sudo tee /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium
      - name: Validate original Workspace reference cases once
        run: |
          mkdir -p /tmp/bricklane-flux-fixed-reference
          npx playwright test tests/templates-flux-settings.spec.ts \
            --grep 'Flux Workspace reference defaults' \
            --workers=1 --retries=0 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/bricklane-flux-fixed-reference/report.json
      - name: Upload original case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-fixed-reference-${{ github.run_id }}
          path: |
            /tmp/bricklane-flux-fixed-reference/
            /tmp/reui-pro-block-playwright/
          if-no-files-found: warn
          retention-days: 7
